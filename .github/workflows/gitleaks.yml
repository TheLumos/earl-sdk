# Lumos secret-scanning CI (free gitleaks stopgap — no GitHub Advanced Security needed).
# Deploy to EVERY repo as .github/workflows/gitleaks.yml. Sentinel's GitHub connector
# fails-closed: any repo without this workflow is flagged, and a failed run here becomes
# a high finding. Uses the gitleaks CLI (the Marketplace action requires a paid license
# for org PRIVATE repos; the CLI is free). --redact means no secret value is ever printed
# or uploaded. Full-history scan catches secrets already committed, not just new ones.
name: gitleaks-secret-scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so push/PR diffs and old commits are scanned
      - name: Run gitleaks (redacted)
        run: |
          VER=8.21.2                # bump as new gitleaks releases land
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose \
            --exit-code 1 --report-format sarif --report-path gitleaks.sarif
      - name: Upload SARIF (redacted, no secret values)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
